<ion-header class="ion-no-border" mode="md">
  <ion-toolbar class="header-color">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/account-types"></ion-back-button>
    </ion-buttons>
    <ion-title size="large" class="ion-text-center"></ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="body-content">
  <div class="container mx-auto p-4 w-full">
    <div class="font-semibold">
      <h3 class="font-medium" style="font-family: Gilroy-Medium">
        Take note of the following
        <strong class="text-[#005B82]">Requirements</strong> before your proceed
      </h3>
    </div>
  </div>

  <div class="content-elements">
    <div class="content-item">
      <div style="display: flex; flex-direction: row">
        <div>
          <h2
            style="
              font-family: Gilroy-Medium;
              padding-right: 10px;
              color: #005b82;
            "
          >
            1
          </h2>
        </div>
        <div>
          <img src="assets/images/id-img.png" alt="" height="400" />
        </div>
      </div>
      <span> Have a <strong>Kenyan</strong> national ID/Passport</span>
    </div>

    <div class="my-progress">
      <span class="step-p"></span>
    </div>
  </div>

  <div class="content-elements">
    <div class="content-item">
      <div style="display: flex; flex-direction: row">
        <div>
          <h2
            style="
              font-family: Gilroy-Medium;
              padding-right: 10px;
              color: #005b82;
            "
          >
            2
          </h2>
        </div>
        <div>
          <img src="assets/images/signature.png" alt="" height="400" />
        </div>
      </div>
      <span> Your signature on a plain piece of paper</span>
    </div>

    <div class="my-progress">
      <span class="step-p"></span>
    </div>
  </div>

  <!-- <div class="uk-text-center ">
    <ion-button
      mode="md"
      type="submit"
      size="medium"
      (click)="openTerms()"
      expand="block"
      >Proceed</ion-button
    >
  </div> -->

  <div
    class="uk-margin uk-margin-large-top uk-text-center flex justify-center w-full"
  >
    <div class="w-[80%]">
      <button
        type="submit"
        class="uk-button uk-button-primary uk-width-1-1"
        (click)="openTerms()"
      >
        <span>Continue</span>
      </button>
    </div>
  </div>
</ion-content>
