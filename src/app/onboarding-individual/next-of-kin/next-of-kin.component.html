<ion-header class="ion-no-border head" mode="md">
  <ion-toolbar class="header-color">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/onboarding/preferences"></ion-back-button>
    </ion-buttons>

    <ion-buttons slot="end">
      <img class="header-img" src="assets/images/logo_blue.png" height="40" />
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="content-body">
  <div class="mx-4 flex items-center gap-2">
    <ion-progress-bar  [value]=".625"></ion-progress-bar>
    <span class="text-xs">5/7</span>
  </div>
  <div class="container mx-auto pt-2 px-4 w-full">
    <div>
      <h3 class="browse">
        Now add your <strong class="text-[#005B82]">Next of Kin</strong> details
      </h3>
    </div>
  </div>

<div class="form-item">
  <form   [formGroup]="authForm" style="">
    <div class="uk-margin-small-bottom">
      <ion-item lines="none" mode="md">
          <ion-label position="stacked" class="labels" style="transform: translateY(30%) scale(0.75) !important; font-size: 20px !important;">First name <span class="uk-text-danger" >*</span>
          </ion-label>
          <ion-input class="uk-input"  name="firstName" maxlength="35" type="text" formControlName="firstName" label="">
          </ion-input>
      </ion-item>
      <div class="validation-error uk-text-danger">
          <small class="error-message"
              *ngIf="f['firstName'].hasError('required') && f['firstName'].dirty">
              <ion-icon name="information-circle-outline"></ion-icon>First name is required
          </small>
      </div>
    </div>
     <!-- Last name -->
    <div class="uk-margin-small-bottom">
      <ion-item lines="none" mode="md">
          <ion-label position="stacked" class="labels" style="transform: translateY(30%) scale(0.75) !important; font-size: 20px !important;" >Last name <span class="uk-text-danger">*</span>
          </ion-label>
          <ion-input class="uk-input" name="lastName" maxlength="35" type="text" formControlName="lastName"  label="">
          </ion-input>
      </ion-item>
      <div class="validation-error uk-text-danger">
          <small class="error-message"
              *ngIf="f['lastName'].hasError('required') && f['lastName'].dirty">
              <ion-icon name="information-circle-outline"></ion-icon>Last name is required
          </small>
      </div>
    </div>

    <div class="uk-margin px-4">
      <label class="uk-form-label" for="emailAddress"
        >Phone Number <span class="uk-text-danger">*</span></label
      >
      <div class="uk-form-controls">
        <ngx-intl-tel-input
          [cssClass]="'uk-input'"
          formControlName="phone"
          [preferredCountries]="[CountryISO.Kenya, CountryISO.Uganda, CountryISO.Rwanda]"
          [searchCountryField]="[SearchCountryField.Iso2, SearchCountryField.Name]"
          [enableAutoCountrySelect]="false"
          [enablePlaceholder]="true"
          [customPlaceholder]="'0700 000 000'"
          [searchCountryFlag]="true"
          [separateDialCode]="false"
          [selectedCountryISO]="CountryISO.Kenya"
        ></ngx-intl-tel-input>
        <div class="validation-error uk-text-danger">
          <small
            class="error-message"
            *ngIf="f['phone'].hasError('required') && f['phone'].dirty && f['phone'].touched"
          >
            <ion-icon name="information-circle-outline"></ion-icon>Phone
            number is required
          </small>
        </div>
      </div>
    </div>

    <div class="uk-margin-small-bottom">
      <ion-item lines="none" mode="md">
        <ion-label position="stacked" class="labels" style="transform: translateY(30%) scale(0.75) !important; font-size: 20px !important;">Relationship<span class="uk-text-danger" >*</span>
        </ion-label>
        <ionic-selectable
          formControlName="relationship"
          [items]="relationships"
          itemValueField="relationCode"
          [hasInfiniteScroll]="true"
          placeholder="--Select--"
          [isEnabled]="true"
          class="uk-input"
          itemTextField="relationDescription"
          [canSearch]="true"
          (onChange)="relationshipChange($event)">
        </ionic-selectable>
      </ion-item>
    </div>

    <br />
    <div class="uk-margin p-4">
      <button
        type="submit"
        class="uk-button uk-button-primary uk-width-1-1"
        [disabled]="!authForm.valid"
        (click)="savePreference()"
      >
        <span *ngIf="!loader.loading" >Submit</span>
        <span *ngIf="loader.loading">
          Submitting...
          <span uk-spinner="ratio: 0.5"></span
        ></span>
      </button>
    </div>
  </form>

</div>

</ion-content>
